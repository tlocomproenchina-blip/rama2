<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Abre las conexiones a los dominios críticos en paralelo con el HTML,
         para que las fuentes y las imágenes no esperen el handshake. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://media.base44.com" />
    <link rel="icon" type="image/jpeg" href="https://media.base44.com/images/public/695da428c9924ef9b68e8866/52211ee9d_f747206d-9aac-45da-b57b-eecb77f854af.jpg" />
    <link rel="apple-touch-icon" href="https://media.base44.com/images/public/695da428c9924ef9b68e8866/52211ee9d_f747206d-9aac-45da-b57b-eecb77f854af.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="TLEC CARGO by TELOCOMPROENCHINA. Tu carga asegurada desde China hasta Venezuela. Consolidamos, aseguramos y entregamos puerta a puerta con seguimiento en tiempo real." />
    <meta name="theme-color" content="#1d4ed8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TLEC CARGO" />
    <link rel="manifest" href="/manifest.json" />
    <title>TLEC CARGO by TELOCOMPROENCHINA | Envíos China a Venezuela puerta a puerta</title>
    <script>
      // En el entorno de desarrollo/preview (no es el dominio publicado) nunca
      // debe haber un service worker: cachea chunks de Vite y provoca que se
      // mezclen versiones de React. Si hay un SW controlando la página, no
      // basta con desregistrarlo en segundo plano: ya estaría sirviendo chunks
      // viejos. En ese caso desregistramos, limpiamos caches y recargamos.
      (function () {
        if (!('serviceWorker' in navigator)) return;
        var isBase44Domain = location.hostname.indexOf('.base44.app') !== -1;
        // En dominios base44.app (preview/desarrollo) NUNCA debe haber SW:
        // cachea chunks de Vite y provoca doble React ("useState null").
        // Si hay un SW controlando, BLOQUEAR la carga sincrónicamente para que
        // no se sirvan chunks stale, limpiar, y luego recargar.
        if (isBase44Domain && navigator.serviceWorker.controller && location.search.indexOf('swclean=1') === -1) {
          // Detener la carga actual (evita que se ejecuten chunks stale)
          try { window.stop(); } catch (e) {}
          // Reemplazar la página con un mensaje de limpieza
          document.documentElement.innerHTML = '<body style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui;background:#f8fafc;color:#475569"><div style="text-align:center"><div style="width:40px;height:40px;border:4px solid #e2e8f0;border-top-color:#3b82f6;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px"></div><p>Actualizando aplicación...</p></div><style>@keyframes spin{to{transform:rotate(360deg)}}</style></body>';
          // Limpiar SW y caches, luego recargar
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
          }).then(function () {
            if (window.caches && caches.keys) {
              return caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (key) { return caches.delete(key); }));
              });
            }
          }).then(function () {
            location.replace(location.pathname + location.hash + '?swclean=1');
          }).catch(function () {
            location.replace(location.pathname + location.hash + '?swclean=1');
          });
          return;
        }
        // Segunda carga (con ?swclean=1): ya no hay SW, limpiar URL y continuar
        if (isBase44Domain && location.search.indexOf('swclean=1') !== -1) {
          try {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
            }).catch(function () {});
          } catch (e) {}
          try {
            var cleanUrl = location.pathname + location.hash;
            history.replaceState(null, '', cleanUrl);
          } catch (e) {}
          return;
        }
        // En dominio base44.app sin SW controlando: limpiar registros stale
        if (isBase44Domain) {
          try {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
            }).catch(function () {});
          } catch (e) {}
          return;
        }
        // En dominio custom (producción): solo limpiar si la versión del SW cambió.
        var SW_VERSION = 'v8';
        var storedVersion;
        try { storedVersion = localStorage.getItem('tlec-sw-version'); } catch (e) {}
        if (storedVersion === SW_VERSION) return;
        try {
          var hadController2 = !!navigator.serviceWorker.controller;
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
          }).then(function () {
            if (window.caches && caches.keys) {
              return caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (key) { return caches.delete(key); }));
              });
            }
          }).then(function () {
            try { localStorage.setItem('tlec-sw-version', SW_VERSION); } catch (e) {}
            if (hadController2 && location.search.indexOf('swclean=1') === -1) {
              var sep2 = location.search ? '&' : '?';
              location.replace(location.href + sep2 + 'swclean=1');
            } else if (location.search.indexOf('swclean=1') !== -1) {
              try {
                var cleanUrl2 = location.pathname + location.hash;
                var params2 = new URLSearchParams(location.search);
                params2.delete('swclean');
                var qs2 = params2.toString();
                if (qs2) cleanUrl2 += '?' + qs2;
                history.replaceState(null, '', cleanUrl2);
              } catch (e) {}
            }
          }).catch(function () {});
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script type="module">
      // Solo registrar el service worker en producción (build real) y SOLO en
      // el dominio custom (no en base44.app). En base44.app el SW cachea chunks
      // de Vite y provoca doble React ("useState null").
      if ('serviceWorker' in navigator && import.meta.env.PROD
          && location.hostname.indexOf('.base44.app') === -1) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
