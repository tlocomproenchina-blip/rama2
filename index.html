<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Abre las conexiones a los dominios críticos en paralelo con el HTML,
         para que las fuentes y las imágenes no esperen el handshake. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://media.base44.com" />
    <link rel="icon" type="image/jpeg" href="https://media.base44.com/images/public/695da428c9924ef9b68e8866/52211ee9d_f747206d-9aac-45da-b57b-eecb77f854af.jpg" />
    <link rel="apple-touch-icon" href="https://media.base44.com/images/public/695da428c9924ef9b68e8866/52211ee9d_f747206d-9aac-45da-b57b-eecb77f854af.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="TLEC CARGO by TELOCOMPROENCHINA. Tu carga asegurada desde China hasta Venezuela. Consolidamos, aseguramos y entregamos puerta a puerta con seguimiento en tiempo real." />
    <meta name="theme-color" content="#1d4ed8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TLEC CARGO" />
    <link rel="manifest" href="/manifest.json" />
    <title>TLEC CARGO by TELOCOMPROENCHINA | Envíos China a Venezuela puerta a puerta</title>
    <script>
      // En el entorno de desarrollo/preview (no es el dominio publicado) nunca
      // debe haber un service worker: cachea chunks de Vite y provoca que se
      // mezclen versiones de React. Si hay un SW controlando la página, no
      // basta con desregistrarlo en segundo plano: ya estaría sirviendo chunks
      // viejos. En ese caso desregistramos, limpiamos caches y recargamos.
      (function () {
        if (!('serviceWorker' in navigator)) return;
        // Solo limpiar si la versión del SW cambió (evita bucle de recarga).
        // Esto previene chunks stale de Vite (doble React → "useState null").
        var SW_VERSION = 'v8';
        var storedVersion;
        try { storedVersion = localStorage.getItem('tlec-sw-version'); } catch (e) {}
        if (storedVersion === SW_VERSION) return; // ya limpio, no hacer nada
        try {
          var hadController = !!navigator.serviceWorker.controller;
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
          }).then(function () {
            if (window.caches && caches.keys) {
              return caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (key) { return caches.delete(key); }));
              });
            }
          }).then(function () {
            try { localStorage.setItem('tlec-sw-version', SW_VERSION); } catch (e) {}
            if (hadController && location.search.indexOf('swclean=1') === -1) {
              var sep = location.search ? '&' : '?';
              location.replace(location.href + sep + 'swclean=1');
            } else if (location.search.indexOf('swclean=1') !== -1) {
              try {
                var cleanUrl = location.pathname + location.hash;
                var params = new URLSearchParams(location.search);
                params.delete('swclean');
                var qs = params.toString();
                if (qs) cleanUrl += '?' + qs;
                history.replaceState(null, '', cleanUrl);
              } catch (e) {}
            }
          }).catch(function () {});
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script type="module">
      // Solo registrar el service worker en producción (build real).
      // En desarrollo el script del <head> ya se encargó de desregistrarlo.
      if ('serviceWorker' in navigator && import.meta.env.PROD) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
