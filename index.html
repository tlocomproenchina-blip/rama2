    <script>
      // Blocking script — runs BEFORE any module scripts are fetched.
      // Ensures stale service workers (old cache-first SW that serves broken
      // Vite dep chunks with duplicate React) are removed before they can
      // intercept requests for the current page load.
      (function () {
        var SW_VERSION = 'v11';
        try {
          var installed = localStorage.getItem('tlec-sw-version');
          if (installed !== SW_VERSION) {
            // Hide the page immediately so the user never sees the broken JS error flash
            document.documentElement.style.visibility = 'hidden';
            var done = function () {
              try { localStorage.setItem('tlec-sw-version', SW_VERSION); } catch (e) {}
              window.location.reload();
            };
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations()
                .then(function (regs) {
                  return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
                })
                .then(function () {
                  if (window.caches && caches.keys) {
                    return caches.keys().then(function (keys) {
                      return Promise.all(keys.map(function (key) { return caches.delete(key); }));
                    });
                  }
                })
                .then(done)
                .catch(done);
            } else {
              done();
            }
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Runtime guard: if React's internal dispatcher is null (caused by the
      // browser loading a mix of stale + fresh Vite dep chunks), force a hard
      // reload so the browser fetches consistent chunks.
      (function () {
        var KEY = 'tlec-react-reload';
        var count = 0;
        try { count = parseInt(sessionStorage.getItem(KEY) || '0', 10) || 0; } catch (e) {}
        window.addEventListener('error', function (event) {
          var msg = (event && event.message) || '';
          if (msg.indexOf("Cannot read properties of null (reading 'useState')") !== -1 ||
              msg.indexOf("reading 'useRef'") !== -1 ||
              msg.indexOf("reading 'useMemo'") !== -1) {
            if (count < 2) {
              try { sessionStorage.setItem(KEY, String(count + 1)); } catch (e) {}
              window.location.reload();
            }
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script type="module">
      if ('serviceWorker' in navigator) {
        if (import.meta.env.DEV) {
          // Dev: ensure no service worker is registered (defensive — the
          // blocking <head> script already handles version-gated cleanup).
          navigator.serviceWorker.getRegistrations()
            .then((regs) => regs.forEach((reg) => reg.unregister()))
            .catch(() => {});
          if (window.caches?.keys) {
            caches.keys().then((keys) => keys.forEach((key) => caches.delete(key))).catch(() => {});
          }
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
          });
        }
      }
    </script>
  </body>
